name: nabu

services:
  proxy:
    image: caddy:2-alpine
    # The stack's ONLY published port. Everything else stays on the compose
    # network, which is what keeps dragoman's and storage's unauthenticated
    # listeners unreachable from the host.
    ports:
      - "${NABU_PORT:-8090}:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      start_period: 2s
      retries: 5
    depends_on:
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ${NABU_FRONTEND_REPO:-https://github.com/mdijkstra-oss/nabu-frontend.git#main}
      # Baked into the static bundle at build time. The /-prefix means
      # same-origin: the app takes scheme and host from window.location.
      args:
        VITE_API_HOST: /api
        VITE_LLM_HOST: /llm
        VITE_EMBEDDINGS_URL: /embeddings
    depends_on:
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped

  storage:
    build:
      context: ${NABU_STORAGE_REPO:-https://github.com/mdijkstra-oss/nabu-storage.git#main}
    environment:
      PERSISTENCE_DIR: /data
    volumes:
      # create_host_path: false so a typo fails here instead of silently
      # producing a root-owned directory storage cannot write.
      - type: bind
        source: ${PROJECT_DIR:?set PROJECT_DIR in .env to a directory for project files}
        target: /data
        bind:
          create_host_path: false
    depends_on:
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped

  embeddings:
    build:
      context: ${NABU_EMBEDDINGS_REPO:-https://github.com/mdijkstra-oss/nabu-embeddings.git#main}
      # The repo ships only a Caddyfile; the image is assembled here so no
      # internal detail leaks into that repo.
      dockerfile_inline: |
        FROM caddy:2-alpine
        COPY Caddyfile /etc/caddy/Caddyfile
        EXPOSE 8082
    # Injected server-side into every upstream request; the key never
    # reaches the browser. No CORS_ORIGIN: behind the proxy every request
    # is same-origin.
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]
      interval: 5s
      timeout: 3s
      start_period: 2s
      retries: 5
    depends_on:
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped

  chancery:
    build:
      context: ${CHANCERY_REPO:-https://github.com/mdijkstra-oss/chancery.git#main}
    # Named so config-check runs this exact image without building it twice.
    image: nabu-chancery
    environment:
      RESPONSES_BASE_URL: http://dragoman:8080
      ENV: production
    # The image's working directory makes /config the default config dir, so
    # the seeded volume is the entire prompt-and-models configuration.
    volumes:
      - prompts:/config:ro
    # Every table nabu-prompts ships sits in the volume side by side; this
    # names which one the tiers resolve against, so switching is a restart
    # rather than a reseed. An absolute path reads a table mounted elsewhere.
    command: ["serve", "--models", "${MODELS:-models.openai.yaml}"]
    # depends_on alone waits for start, not for listening.
    depends_on:
      preflight:
        condition: service_completed_successfully
      # The seed empties the volume before it refills it, so a chancery that
      # started alongside it would read a config directory mid-rewrite.
      prompts-seed:
        condition: service_completed_successfully
      dragoman:
        condition: service_healthy
    restart: unless-stopped

  dragoman:
    build:
      context: ${DRAGOMAN_REPO:-https://github.com/mdijkstra-oss/dragoman.git#main}
    # No config mount and no command: the image defaults already serve the
    # embedded service table on 0.0.0.0:8080. All five keys pass so any
    # models yaml that clears preflight never dies keyless at first request.
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped

  prompts-seed:
    build:
      context: ${NABU_PROMPTS_REPO:-https://github.com/mdijkstra-oss/nabu-prompts.git#main}
      dockerfile_inline: |
        FROM alpine:3
        COPY config/ /seed/config/
        # Replace, not merge: a prompt file deleted upstream must disappear
        # from the volume too.
        ENTRYPOINT ["sh", "-c", "find /prompts -mindepth 1 -delete && cp -R /seed/config/. /prompts/"]
    volumes:
      - prompts:/prompts

  # chancery reading its own seeded configuration and reporting every fault in
  # it — a missing MODELS table, an agent naming an alias the table lacks, a
  # prompt including a file that is not there. Running it here makes those a
  # stop with a diagnostic instead of a chancery that boots, exits and is
  # restarted forever.
  config-check:
    build:
      context: ${CHANCERY_REPO:-https://github.com/mdijkstra-oss/chancery.git#main}
    image: nabu-chancery
    volumes:
      - prompts:/config:ro
    command: ["validate", "--models", "${MODELS:-models.openai.yaml}"]
    depends_on:
      prompts-seed:
        condition: service_completed_successfully

  # The gate every service waits behind, so a stack that cannot work does not
  # half-start. It checks the one key nothing else checks: the embeddings
  # service injects OPENAI_API_KEY into every upstream request without
  # validating it, so an empty one surfaces as an opaque 401 at the first
  # embedding. Every other provider key is dragoman's business — it serves
  # without them and answers a request it cannot authenticate by naming the
  # variable that is missing.
  #
  # It runs as storage's user so the writability test answers the question
  # storage will ask. Docker Desktop remaps ownership, so a PROJECT_DIR owned
  # by another user only fails this on Linux; a read-only mode fails on both.
  preflight:
    image: alpine:3
    user: "65532:65532"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - type: bind
        source: ${PROJECT_DIR:?set PROJECT_DIR in .env to a directory for project files}
        target: /data
        bind:
          create_host_path: false
    command:
      - sh
      - -c
      - >-
        { test -n "$${OPENAI_API_KEY}" ||
        { echo "preflight: OPENAI_API_KEY is unset or empty, required by the embeddings service" >&2; exit 1; }; } &&
        { test -w /data ||
        { echo "preflight: PROJECT_DIR is not writable by uid 65532, the user storage runs as" >&2; exit 1; }; }
    depends_on:
      config-check:
        condition: service_completed_successfully

volumes:
  # Rewritten by prompts-seed on every start; disposable.
  prompts:
