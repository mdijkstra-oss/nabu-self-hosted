# Every tier on ANTHROPIC_API_KEY alone — for easy development; consensus within one provider is moot.
models:
  # corpus-describer, file-hyde, generic-hyde, hyde-generator, section-labeler, topic-assigner
  lite:
    model: anthropic/claude-haiku-4-5
    reasoning_effort: minimal

  # scout-filter
  mid:
    model: anthropic/claude-sonnet-5
    reasoning_effort: minimal

  # qual-coder, semantic-filter, refine-code
  strong:
    model: anthropic/claude-opus-5
    reasoning_effort: medium

  # An alias prompt resolves against shared/ and goes in front of the agent's own.
  strong-planning:
    extends: strong
    prompt: nabu/modes/planning.md
  strong-execution:
    extends: strong
    prompt: nabu/modes/execution.md

  # deep-analysis-adjudicate and both deep-analysis-filter voters.
  expert:
    model: anthropic/claude-fable-5
    reasoning_effort: low
